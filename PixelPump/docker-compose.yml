version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pixelpump-db
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mdp123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - pixelpump-network

  backend:
    build: .
    container_name: pixelpump-backend
    environment:
      DB_NAME: portfolio
      DB_USER: postgres
      DB_PASS: mdp123
      DB_HOST: postgres
      DB_PORT: 5432
      JWT_SECRET: pixelpump-super-secret-key-2024
      NODE_ENV: production
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    networks:
      - pixelpump-network
    restart: unless-stopped

  frontend:
    image: node:18-alpine
    container_name: pixelpump-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_URL=http://localhost:3001
    networks:
      - pixelpump-network
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  pixelpump-network:
    driver: bridge
